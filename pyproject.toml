[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (urutan import)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # baris panjang ditoleransi untuk string tabel/UI rich
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
