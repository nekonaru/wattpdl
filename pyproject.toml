[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattpdl"
version = "1.2.0"
description = "Script Python + Rich CLI untuk mengunduh cerita Wattpad ke .txt/.docx offline"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nekonaru" }]
requires-python = ">=3.9"
keywords = ["wattpad", "downloader", "cli", "scraper", "offline-reading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "python-docx>=1.1",
    "EbookLib>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/nekonaru/wattpdl"
Repository = "https://github.com/nekonaru/wattpdl"
Issues = "https://github.com/nekonaru/wattpdl/issues"

[project.scripts]
wattpdl = "wattpdl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (urutan import)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # baris panjang ditoleransi untuk string tabel/UI rich
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
