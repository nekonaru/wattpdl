[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattpdl"
dynamic = ["version"]
description = "Python script with a Rich CLI to download Wattpad stories as offline .txt/.docx/.epub/.md/.pdf files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nekonaru" }]
requires-python = ">=3.9"
keywords = ["wattpad", "downloader", "cli", "scraper", "offline-reading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "python-docx>=1.1",
    "EbookLib>=0.18",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "responses>=0.25", "ruff>=0.16", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/nekonaru/wattpdl"
Repository = "https://github.com/nekonaru/wattpdl"
Issues = "https://github.com/nekonaru/wattpdl/issues"

[project.scripts]
wattpdl = "wattpdl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "wattpdl.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "FA",  # flake8-future-annotations, catches PEP 604 syntax (`X | Y`) which is
           # incompatible with target-version py39 (only supported from 3.10)
]
ignore = [
    "E501",   # long lines are tolerated for rich table/UI strings
    "FA100",  # modernization suggestion Optional[X] -> X | None; not a bug, keep Optional explicit
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
