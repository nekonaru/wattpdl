repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
        pass_filenames: true
      - id: secret-scan
        name: secret scan
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: true
